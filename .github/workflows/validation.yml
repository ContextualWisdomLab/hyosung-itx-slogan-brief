name: PR Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: validation
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install Node dependencies
        run: npm install --no-save docx

      - name: Build DOCX
        run: |
          node scripts/build_docx.js
          node scripts/build_materials_request_docx.js

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install Python validation tools
        run: python -m pip install --disable-pip-version-check -r requirements-opencode-review-ci.txt

      - name: Run tests with coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage report --fail-under=100

      - name: Check docstrings
        run: python -m interrogate --fail-under=100 .
