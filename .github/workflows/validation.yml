name: PR Validation

on:
  pull_request:
    branches:
      - main
    # NOTE: this is an enumerated allowlist of genuinely CI-inert docs, not a
    # blanket "docs/**"/"*.md" ignore. The Build DOCX step below parses
    # docs/hyosung_itx_slogan_proposal_materials_request.md as build input
    # (see scripts/build_materials_request_docx.js), so that file must keep
    # triggering this workflow. Any new/unlisted doc path defaults to
    # triggering CI (safe by default) rather than being silently skipped.
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "DESIGN.md"
      - "docs/hyosung_itx_slogan_brief.md"
      - "docs/training/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: validation
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install Node dependencies
        run: npm install --no-save --package-lock=false docx

      - name: Build DOCX
        run: |
          node scripts/build_docx.js
          node scripts/build_materials_request_docx.js
